<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbound Sprint</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05071a;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- Phaser 3.90.0 (bundled locally so the game also works offline) -->
  <script src="lib/phaser.min.js"></script>

  <!-- Game code. Order matters: each file may use the ones above it. -->
  <script src="src/config.js"></script>
  <script src="src/progression.js"></script>
  <script src="src/level/levelData.js"></script>
  <script src="src/utils/backdrop.js"></script>
  <script src="src/utils/ui.js"></script>
  <script src="src/entities/Player.js"></script>
  <script src="src/entities/Enemy.js"></script>
  <script src="src/level/LevelBuilder.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/StageSelectScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/PauseScene.js"></script>
  <script src="src/scenes/EndScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
